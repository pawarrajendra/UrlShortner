# P5: five long-running services and one non-web migration job.
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set bootstrap password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set runtime password}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Set migration password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    image: urlshortener:local
    pull_policy: never
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_USERNAME: ${DATABASE_MIGRATION_USERNAME:?Set migration username}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Set migration password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 20
  app-1:
    image: urlshortener:local
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set runtime username}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set runtime password}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ANALYTICS_WORKERS: ${ANALYTICS_WORKERS:-2}
      ANALYTICS_QUEUE_CAPACITY: ${ANALYTICS_QUEUE_CAPACITY:-1000}
      ANALYTICS_MAX_QUEUE_WAIT: ${ANALYTICS_MAX_QUEUE_WAIT:-5s}
      ANALYTICS_CLEANUP_ENABLED: 'true'
      APP_INSTANCE_ID: app-1
      REDIRECT_CACHE_ENABLED: ${REDIRECT_CACHE_ENABLED:-true}
      REDIRECT_CONSISTENCY_MODE: ${REDIRECT_CONSISTENCY_MODE:-cached}
      REDIS_HOST: redis
      REDIRECT_FALLBACK_CONCURRENCY: ${REDIRECT_FALLBACK_CONCURRENCY:-4}
      ANALYTICS_CLEANUP_BATCH_SIZE: ${ANALYTICS_CLEANUP_BATCH_SIZE:-1000}
      ANALYTICS_CLEANUP_INTERVAL: ${ANALYTICS_CLEANUP_INTERVAL:-1h}
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 6
  app-2:
    image: urlshortener:local
    pull_policy: never
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set runtime username}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set runtime password}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ANALYTICS_WORKERS: ${ANALYTICS_WORKERS:-2}
      ANALYTICS_QUEUE_CAPACITY: ${ANALYTICS_QUEUE_CAPACITY:-1000}
      ANALYTICS_MAX_QUEUE_WAIT: ${ANALYTICS_MAX_QUEUE_WAIT:-5s}
      ANALYTICS_CLEANUP_ENABLED: 'false'
      APP_INSTANCE_ID: app-2
      REDIRECT_CACHE_ENABLED: ${REDIRECT_CACHE_ENABLED:-true}
      REDIRECT_CONSISTENCY_MODE: ${REDIRECT_CONSISTENCY_MODE:-cached}
      REDIS_HOST: redis
      REDIRECT_FALLBACK_CONCURRENCY: ${REDIRECT_FALLBACK_CONCURRENCY:-4}
      ANALYTICS_CLEANUP_BATCH_SIZE: ${ANALYTICS_CLEANUP_BATCH_SIZE:-1000}
      ANALYTICS_CLEANUP_INTERVAL: ${ANALYTICS_CLEANUP_INTERVAL:-1h}
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 6
  nginx:
    image: nginx:1.28.0-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/health/ingress]
      interval: 2s
      timeout: 1s
      retries: 20
volumes:
  postgres_data:
