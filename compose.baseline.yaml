# Phases 1–4: one app, PostgreSQL, and a migration job. Redis/NGINX/replicas arrive P5.
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set bootstrap password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set runtime password}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Set migration password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_USERNAME: ${DATABASE_MIGRATION_USERNAME:?Set migration username}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Set migration password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set runtime username}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set runtime password}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ANALYTICS_WORKERS: ${ANALYTICS_WORKERS:-2}
      ANALYTICS_QUEUE_CAPACITY: ${ANALYTICS_QUEUE_CAPACITY:-1000}
      ANALYTICS_MAX_QUEUE_WAIT: ${ANALYTICS_MAX_QUEUE_WAIT:-5s}
      ANALYTICS_CLEANUP_ENABLED: ${ANALYTICS_CLEANUP_ENABLED:-true}
      ANALYTICS_CLEANUP_BATCH_SIZE: ${ANALYTICS_CLEANUP_BATCH_SIZE:-1000}
      ANALYTICS_CLEANUP_INTERVAL: ${ANALYTICS_CLEANUP_INTERVAL:-1h}
    stop_grace_period: 15s
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres_data:
