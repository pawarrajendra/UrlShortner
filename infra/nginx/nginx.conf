worker_processes 1;
events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 1s;
    log_format upstream '$request_id app_request_id=$upstream_http_x_request_id instance=$upstream_http_x_app_instance method=$request_method status=$status upstream=$upstream_addr upstream_status=$upstream_status time=$request_time';
    access_log /var/log/nginx/access.log upstream;
    upstream applications {
        zone applications 64k;
        least_conn;
        server app-1:8080 resolve max_fails=1 fail_timeout=2s;
        server app-2:8080 resolve max_fails=1 fail_timeout=2s;
        keepalive 16;
    }
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 16k;
        location = /health/ingress {
            access_log off;
            return 200 'UP';
        }
        location / {
            proxy_pass http://applications;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded '';
            proxy_set_header X-App-Instance '';
            proxy_connect_timeout 1s;
            proxy_read_timeout 4s;
            proxy_send_timeout 4s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 4s;
            proxy_cache off;
            proxy_buffering off;
        }
    }
}
