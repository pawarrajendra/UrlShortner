name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify required Docker runtime
        run: docker info > /dev/null
      - name: Blocking formatting, style, unit and PostgreSQL/Redis integration checks
        run: ./mvnw -B -ntp clean verify
      - name: Export resolved Maven dependencies
        run: ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.10.0:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
      - name: Blocking known-advisory gate (network required)
        run: python3 scripts/dependency-audit.py
      - name: Validate public API contracts
        run: |
          ruby scripts/validate-contract.rb
          ruby scripts/validate-contract.rb --phase2
          ruby scripts/validate-contract.rb --phase3
          ruby scripts/validate-contract.rb --phase4
          ruby scripts/validate-contract.rb --phase5
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/dependency-tree.json
            target/dependency-audit.json
